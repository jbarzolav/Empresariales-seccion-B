{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'news/css/style.css' %}">
    <title>{% block title %}News Portal{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'news:home' %}">News Portal</a></h1>
        <nav aria-label="Main navigation">
            {% block navigation %}{% endblock %}
        </nav>
    </header>

    <main>
        <section>
            {% block content %}{% endblock %}
        </section>

        <aside>
            {% block sidebar %}
            <h2>News categories</h2>
            {% endblock %}
        </aside>
    </main>

    <footer>
        <p>&copy; {% now "Y" %} News Portal</p>
    </footer>
</body>
</html>
